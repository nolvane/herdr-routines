[package]
name = "herdr-routines"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Herdr plugin that runs coding agents on a schedule, each run in its own tab, while Herdr runs"
license = "MIT"
repository = "https://github.com/nolvane/herdr-routines"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# For `killpg` alone: stopping a command together with what it started.
libc = "0.2.191"
# Without the default features the list does not use (the macros crate
# and the calendar widget).
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = true
strip = true
