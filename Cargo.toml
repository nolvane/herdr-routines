[package]
name = "herdr-routines"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin that runs coding agents on a schedule, each run in its own tab, while Herdr runs"
license = "MIT"
repository = "https://github.com/nolvane/herdr-routines"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[profile.release]
opt-level = 3
lto = true
strip = true
