# herdr-routines: runs coding agents on a schedule while Herdr runs.

id = "herdr-routines"
name = "herdr-routines"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Runs coding agents (Claude Code, Codex and others) and shell commands on a schedule, each run in its own tab, and follows your cron jobs, with a list to manage routines and their runs"
platforms = ["linux", "macos"]

# Builds the binary into the plugin root (needs cargo).
[[build]]
command = ["sh", "scripts/build.sh"]

# Starts the scheduler in the background. The command detaches and returns at once.
[[startup]]
command = ["./herdr-routines", "start"]

# The list of routines and runs.
[[panes]]
id = "list"
title = "herdr-routines"
placement = "overlay"
command = ["./herdr-routines", "list"]

# The popup about a run (failed, too long, needs you, finished) for routines
# set to tell by popup. It stays until it is answered.
[[panes]]
id = "alert"
title = "herdr-routines"
placement = "overlay"
command = ["./herdr-routines", "alert-pane"]

[[actions]]
id = "open"
title = "herdr-routines: open or close"
description = "Show the routines and their runs"
contexts = ["global"]
command = ["./herdr-routines", "open"]

[[actions]]
id = "open-split"
title = "herdr-routines: open or close below the pane"
description = "Show the routines in a split below the pane"
contexts = ["global"]
command = ["./herdr-routines", "open", "split"]

[[actions]]
id = "restart"
title = "herdr-routines: restart the scheduler"
description = "Start a fresh scheduler in place of the running one"
contexts = ["global"]
command = ["./herdr-routines", "restart"]

[[actions]]
id = "stop"
title = "herdr-routines: stop the scheduler"
description = "Stop running routines until the next start or restart"
contexts = ["global"]
command = ["./herdr-routines", "stop"]

[[actions]]
id = "status"
title = "herdr-routines: scheduler status"
description = "Show whether the scheduler runs"
contexts = ["global"]
command = ["./herdr-routines", "status"]
